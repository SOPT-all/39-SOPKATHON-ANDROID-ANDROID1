name: Request Android team review

on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize]

permissions:
  pull-requests: write

jobs:
  request-review:
    if: ${{ !github.event.pull_request.draft && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    steps:
      - name: Request Android team members
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          reviewers=(shinisme heejin0316 hyeminililo chldmswll)
          requested=$(gh api "repos/$GH_REPO/pulls/$PR_NUMBER/requested_reviewers" --jq '.users[].login')
          reviewed=$(gh api "repos/$GH_REPO/pulls/$PR_NUMBER/reviews" --jq '.[].user.login')
          args=()

          for reviewer in "${reviewers[@]}"; do
            if [[ "$reviewer" == "$PR_AUTHOR" ]] ||
               grep -Fxq "$reviewer" <<< "$requested" ||
               grep -Fxq "$reviewer" <<< "$reviewed"; then
              continue
            fi

            args+=(-f "reviewers[]=$reviewer")
          done

          if (( ${#args[@]} > 0 )); then
            gh api -X POST "repos/$GH_REPO/pulls/$PR_NUMBER/requested_reviewers" "${args[@]}" --silent
          fi
